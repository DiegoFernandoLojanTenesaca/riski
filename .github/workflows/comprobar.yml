# Que lo publicado siga siendo cierto.
#
# **La lógica está en `comprobaciones.py`, no aquí.** Un script metido en un
# `run: |` con heredoc no se puede correr igual en local, y las comillas
# anidadas dentro del YAML son una fuente de fallos que no se ven hasta que el
# CI está en rojo. Así se ejecuta lo mismo en los dos sitios.

name: comprobar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: instalar
        run: pip install onnxruntime pillow numpy

      - name: el modelo, el README y las páginas
        run: python comprobaciones.py
